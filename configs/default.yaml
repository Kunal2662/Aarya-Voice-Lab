# AARYA Voice Lab — default configuration.
#
# No secrets, credentials, API keys, or paths to private recordings
# belong in this file (or any tracked config). See docs/SECURITY.md.

project_name: "AARYA Voice Lab"
schema_version: "0.1.0"
pipeline_version: "0.1.0"

# Local-first: no cloud voice provider is configured or permitted in
# Phase 0. Future cloud adapters, if ever added, must be optional and
# disabled by default.
providers:
  tts: null
  diarization: null
  transcription: null

# Directories treated as privacy-sensitive. Kept in sync with
# aarya_voice_lab.core.paths.PROTECTED_DIRECTORIES and .gitignore.
protected_directories:
  - source
  - datasets
  - models
  - experiments
  - benchmarks
  - reports
  - logs
  - manifests

# Isolated ML environments. Kept separate because co-installing NeMo and
# WhisperX silently downgrades the stack — see docs/COMPATIBILITY.md.
# None of these is built in Phase 1.
environments:
  base:
    python: "3.11-3.13"
  env-nemo:
    python: "3.12"
    torch: "2.13.0"
  env-whisperx:
    python: "3.12"
    torch: "2.8.0"
    requires_approval: true
  env-tts:
    python: "3.12"
    requires_approval: true

# Disabled for every stage subprocess; see pipeline/runner.py.
telemetry:
  disabled: true
# Stage subprocesses fail rather than silently download model weights.
offline_by_default: true

speaker_policy:
  high_confidence_threshold: 0.90
  medium_confidence_threshold: 0.70
  reject_overlap_by_default: true
  require_independent_verification: true
