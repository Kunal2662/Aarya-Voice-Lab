# AARYA Voice Lab — default configuration.
#
# No secrets, credentials, API keys, or paths to private recordings
# belong in this file (or any tracked config). See docs/SECURITY.md.

project_name: "AARYA Voice Lab"
schema_version: "0.1.0"
pipeline_version: "0.1.0"

# Local-first: no cloud voice provider is configured or permitted in
# Phase 0. Future cloud adapters, if ever added, must be optional and
# disabled by default.
providers:
  tts: null
  diarization: null
  transcription: null

# Directories treated as privacy-sensitive. Kept in sync with
# aarya_voice_lab.core.paths.PROTECTED_DIRECTORIES and .gitignore.
protected_directories:
  - source
  - datasets
  - models
  - experiments
  - benchmarks
  - reports
  - logs
  - manifests

# Isolated ML environments. Kept separate because co-installing NeMo and
# WhisperX silently downgrades the stack — see docs/COMPATIBILITY.md.
# None of these is built in Phase 1.
environments:
  base:
    python: "3.11-3.13"
  env-nemo:
    python: "3.12"
    torch: "2.13.0"
  env-whisperx:
    python: "3.12"
    torch: "2.8.0"
    requires_approval: true
  env-tts:
    python: "3.12"
    requires_approval: true

# Disabled for every stage subprocess; see pipeline/runner.py.
telemetry:
  disabled: true
# Stage subprocesses fail rather than silently download model weights.
offline_by_default: true

speaker_policy:
  high_confidence_threshold: 0.90
  medium_confidence_threshold: 0.70
  reject_overlap_by_default: true
  require_independent_verification: true

# Real Voice Model Engine milestone -- training-readiness thresholds.
# These are conservative, documented starting points (not measured
# against any specific model's actual data requirements, since no real
# training backend is installed yet -- see docs/REAL_VOICE_MODEL_ENGINE.md).
# A model-specific TrainingProvider may declare stricter requirements of
# its own; pipeline.training_readiness never lowers what a provider asks
# for, only raises the floor when this config asks for more than the
# provider does.
training_readiness:
  minimum_sample_count: 20
  minimum_total_duration_seconds: 300
  minimum_average_duration_seconds: 2.0
  required_sample_rate: 16000
  required_channels: 1
  max_clipping_ratio: 0.01
  max_silence_ratio: 0.5
  minimum_snr_db: 15.0
